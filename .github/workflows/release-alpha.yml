name: Release Windows alpha

on:
  push:
    tags:
      - "v*.*.*-alpha.*"

permissions:
  contents: write

jobs:
  release-alpha:
    environment: alpha
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.201
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: microsoft/setup-msbuild@v3

      - name: Resolve exact alpha version
        id: version
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          if ('${{ github.ref }}' -cne "refs/tags/$tag" -or
              $tag -notmatch '^v(?<base>\d+\.\d+\.\d+)-alpha\.(?<alpha>[1-9]\d*)$') {
            throw "Alpha release requires refs/tags/vX.Y.Z-alpha.N; got ${{ github.ref }}."
          }
          git tag -d $tag 2>$null
          git fetch --force --no-tags origin "refs/tags/$tag`:refs/tags/$tag"
          if ($LASTEXITCODE -ne 0 -or (git rev-parse "$tag^{commit}").Trim() -cne $env:GITHUB_SHA) {
            throw 'The authoritative alpha tag does not peel to GITHUB_SHA.'
          }
          "tag=$tag" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "base=$($Matches.base)" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "alpha=$($Matches.alpha)" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Restore alpha signing material
        shell: pwsh
        env:
          PACKAGE_PFX_BASE64: ${{ secrets.WINDOWS_ALPHA_PACKAGE_CERTIFICATE_BASE64 }}
          SETUP_PFX_BASE64: ${{ secrets.WINDOWS_ALPHA_SETUP_CERTIFICATE_BASE64 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:PACKAGE_PFX_BASE64) -or
              [string]::IsNullOrWhiteSpace($env:SETUP_PFX_BASE64)) {
            throw 'Alpha signing credentials are absent.'
          }
          [IO.File]::WriteAllBytes((Join-Path $env:RUNNER_TEMP 'alpha-package.pfx'), [Convert]::FromBase64String($env:PACKAGE_PFX_BASE64))
          [IO.File]::WriteAllBytes((Join-Path $env:RUNNER_TEMP 'alpha-setup.pfx'), [Convert]::FromBase64String($env:SETUP_PFX_BASE64))

      - name: Acquire exact Rusty Kiosk alpha owner bundle
        id: kiosk
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          KIOSK_TAG: ${{ vars.RUSTY_KIOSK_ALPHA_TAG }}
          KIOSK_MANIFEST_SHA256: ${{ vars.RUSTY_KIOSK_ALPHA_MANIFEST_SHA256 }}
          KIOSK_SIGNER_SHA256: ${{ vars.RUSTY_KIOSK_ALPHA_SIGNER_SHA256 }}
          KIOSK_MAIN_PACKAGE: ${{ vars.RUSTY_KIOSK_ALPHA_MAIN_PACKAGE }}
          KIOSK_HELPER_PACKAGE: ${{ vars.RUSTY_KIOSK_ALPHA_HELPER_PACKAGE }}
        run: |
          if ($env:KIOSK_TAG -notmatch '^v\d+\.\d+\.\d+-alpha\.[1-9]\d*$' -or
              $env:KIOSK_MANIFEST_SHA256 -notmatch '^[0-9a-f]{64}$' -or
              $env:KIOSK_SIGNER_SHA256 -notmatch '^[0-9a-f]{64}$' -or
              [string]::IsNullOrWhiteSpace($env:KIOSK_MAIN_PACKAGE) -or
              [string]::IsNullOrWhiteSpace($env:KIOSK_HELPER_PACKAGE)) {
            throw 'The protected alpha environment is missing an exact Kiosk tag, manifest hash, signer, or package identity.'
          }
          $release = gh release view $env:KIOSK_TAG --repo MesmerPrism/Rusty-Kiosk --json tagName,isDraft,isPrerelease,assets | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $release.tagName -cne $env:KIOSK_TAG -or
              $release.isDraft -or -not $release.isPrerelease) {
            throw 'The exact Kiosk alpha tag is not a published prerelease.'
          }
          $expectedAssets = @('RUSTY-KIOSK-LICENSE.txt','RUSTY-KIOSK-SOURCE.txt','bundle-manifest.json','rusty-kiosk-setup-helper.apk','rusty-kiosk.apk')
          $actualAssets = @($release.assets.name | Sort-Object)
          if (@(Compare-Object $expectedAssets $actualAssets).Count -ne 0) {
            throw 'The Kiosk alpha release asset set is incomplete or contains unreviewed assets.'
          }
          $revision = (gh api "repos/MesmerPrism/Rusty-Kiosk/commits/$($env:KIOSK_TAG)" --jq .sha).Trim()
          if ($LASTEXITCODE -ne 0 -or $revision -notmatch '^[0-9a-f]{40}$') { throw 'Could not resolve the exact Kiosk alpha tag commit.' }
          $directory = Join-Path $env:GITHUB_WORKSPACE 'artifacts\kiosk-bundle'
          New-Item -ItemType Directory -Path $directory -Force | Out-Null
          gh release download $env:KIOSK_TAG --repo MesmerPrism/Rusty-Kiosk --dir $directory
          if ($LASTEXITCODE -ne 0) { throw 'Exact Kiosk alpha bundle acquisition failed.' }
          "version=$($env:KIOSK_TAG.Substring(1))" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "revision=$revision" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Build and validate complete alpha product
        shell: pwsh
        env:
          PACKAGE_PASSWORD: ${{ secrets.WINDOWS_ALPHA_PACKAGE_CERTIFICATE_PASSWORD }}
          SETUP_PASSWORD: ${{ secrets.WINDOWS_ALPHA_SETUP_CERTIFICATE_PASSWORD }}
          PUBLISHER: ${{ secrets.WINDOWS_ALPHA_PACKAGE_PUBLISHER }}
          KIOSK_MANIFEST_SHA256: ${{ vars.RUSTY_KIOSK_ALPHA_MANIFEST_SHA256 }}
          KIOSK_SIGNER_SHA256: ${{ vars.RUSTY_KIOSK_ALPHA_SIGNER_SHA256 }}
          KIOSK_MAIN_PACKAGE: ${{ vars.RUSTY_KIOSK_ALPHA_MAIN_PACKAGE }}
          KIOSK_HELPER_PACKAGE: ${{ vars.RUSTY_KIOSK_ALPHA_HELPER_PACKAGE }}
          KIOSK_TAG: ${{ vars.RUSTY_KIOSK_ALPHA_TAG }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:PACKAGE_PASSWORD) -or
              [string]::IsNullOrWhiteSpace($env:SETUP_PASSWORD) -or
              [string]::IsNullOrWhiteSpace($env:PUBLISHER)) {
            throw 'Alpha signing credentials are absent.'
          }
          ./tools/app/Invoke-ReleaseBuild.ps1 `
            -Version '${{ steps.version.outputs.base }}' -AlphaNumber '${{ steps.version.outputs.alpha }}' `
            -Channel alpha -ReleaseTag '${{ steps.version.outputs.tag }}' `
            -PackageCertificatePath (Join-Path $env:RUNNER_TEMP 'alpha-package.pfx') -PackageCertificatePassword $env:PACKAGE_PASSWORD `
            -SetupCertificatePath (Join-Path $env:RUNNER_TEMP 'alpha-setup.pfx') -SetupCertificatePassword $env:SETUP_PASSWORD `
            -Publisher $env:PUBLISHER `
            -ExpectedKioskVersion '${{ steps.kiosk.outputs.version }}' -ExpectedKioskTag $env:KIOSK_TAG `
            -ExpectedKioskReleaseUrl "https://github.com/MesmerPrism/Rusty-Kiosk/releases/tag/$($env:KIOSK_TAG)" `
            -ExpectedKioskSourceRevision '${{ steps.kiosk.outputs.revision }}' `
            -ExpectedKioskManifestSha256 $env:KIOSK_MANIFEST_SHA256 -ExpectedKioskSignerSha256 $env:KIOSK_SIGNER_SHA256 `
            -ExpectedKioskMainPackageName $env:KIOSK_MAIN_PACKAGE -ExpectedKioskHelperPackageName $env:KIOSK_HELPER_PACKAGE

      - uses: actions/upload-artifact@v7
        with:
          name: QuestIonAbleFileManager-windows-alpha
          path: artifacts/release

      - name: Publish immutable GitHub prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ steps.version.outputs.tag }}'
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) { throw "Release $tag already exists; alpha assets are immutable." }
          $assets = Get-ChildItem artifacts/release -File | ForEach-Object FullName
          gh release create $tag $assets --title "QuestIonAble File Manager Alpha $tag" --generate-notes --prerelease --latest=false --target $env:GITHUB_SHA

      - name: Remove temporary signing files
        if: always()
        shell: pwsh
        run: |
          Remove-Item -LiteralPath (Join-Path $env:RUNNER_TEMP 'alpha-package.pfx') -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath (Join-Path $env:RUNNER_TEMP 'alpha-setup.pfx') -Force -ErrorAction SilentlyContinue
